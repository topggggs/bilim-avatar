name: bilim-avatar
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bilim
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilim']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  s3:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    command: /data
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['s3data:/data']
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file: .env
    environment:
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://bilim:${POSTGRES_PASSWORD}@postgres:5432/bilim
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    ports: ['127.0.0.1:3001:3001']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    command: ['npm', 'run', 'worker']
    env_file: .env
    environment:
      STORAGE_MODE: postgres
      DATABASE_URL: postgres://bilim:${POSTGRES_PASSWORD}@postgres:5432/bilim
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
volumes:
  pgdata:
  redisdata:
  s3data:
